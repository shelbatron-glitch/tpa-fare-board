name: Check flights

on:
  schedule:
    - cron: "23 12 * * 1,4"   # Mondays and Thursdays around 7:23am Eastern (GitHub sometimes runs late)
  workflow_dispatch:           # adds a "Run workflow" button for an on-demand check

permissions:
  contents: write

concurrency:
  group: flight-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check Google Flights
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python flight_tracker.py

      - name: Save results
        if: always()
        run: |
          git config user.name "flight-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state.json 2>/dev/null || git add docs/data
          git diff --cached --quiet || git commit -m "Flight check $(date -u +%Y-%m-%d)"
          git push
