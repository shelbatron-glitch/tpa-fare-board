<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TPA Fare Board</title>
<meta name="description" content="Cheap flights out of Tampa, checked automatically.">
<meta name="theme-color" content="#0b1726">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fare Board">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0b1726; --board: #101f33; --tile: #17293f; --tile-2: #1d3350; --rule: #243b58;
    --amber: #ffc53d; --amber-2: #ffdf8a; --text: #e9eef5; --dim: #8fa3bb; --go: #4ade80; --over: #f59e7b;
    --paper: #f4f1ea; --ink: #14202e; --ink-2: #5b6878; --line: #e2ddd2;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #0e1a29; --ink: #e9eef5; --ink-2: #9aabbf; --line: #22354d; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans); }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 18px; }

  /* ---- The board (header + deals) ---- */
  .board { background: var(--night); color: var(--text);
           background-image: radial-gradient(1200px 400px at 80% -10%, #1b3a5e 0%, transparent 60%); }
  .board .wrap { padding-top: calc(env(safe-area-inset-top) + 22px); padding-bottom: 26px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 13px/1 var(--mono);
           letter-spacing: .18em; color: var(--amber); text-transform: uppercase; }
  .brand svg { width: 22px; height: 22px; }
  .checked { font: 500 12px/1.3 var(--mono); color: var(--dim); text-align: right; }
  h1 { margin: 22px 0 4px; font: 800 clamp(40px, 12vw, 72px)/.95 var(--mono); letter-spacing: -.04em; }
  h1 .flap { display: inline-block; background: var(--tile); border-radius: 6px; padding: 0 .08em; margin-right: .06em;
             box-shadow: inset 0 -2px 0 rgba(0,0,0,.35); position: relative; }
  h1 .flap::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--night); opacity: .8; }
  .sub { margin: 10px 0 0; color: var(--dim); font-size: 15px; }
  .sub b { color: var(--text); font-weight: 600; }

  .notice { margin: 18px 0 0; padding: 11px 14px; border-radius: 10px; font-size: 14px;
            background: rgba(255,197,61,.12); border: 1px solid rgba(255,197,61,.35); color: var(--amber-2); }
  .notice p { margin: 0; } .notice p + p { margin-top: 4px; }

  .sect { margin: 26px 0 10px; font: 700 12px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--amber); }
  .deals { display: grid; gap: 12px; }
  .deal { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center;
          background: var(--board); border: 1px solid var(--rule); border-radius: 14px; padding: 14px;
          text-decoration: none; transition: transform .15s ease, border-color .15s ease; }
  .deal:hover { transform: translateY(-1px); border-color: var(--amber); }
  .tiles { display: flex; gap: 3px; grid-row: span 2; }
  .tiles span { width: 30px; height: 42px; display: grid; place-items: center; background: var(--tile);
                border-radius: 5px; font: 800 24px/1 var(--mono); color: var(--amber); position: relative;
                box-shadow: inset 0 -2px 0 rgba(0,0,0,.35); }
  .tiles span::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1.5px; background: var(--night); }
  .deal .city { font-weight: 600; font-size: 16px; line-height: 1.25; }
  .deal .meta { color: var(--dim); font-size: 13px; line-height: 1.35; }
  .deal .price { grid-row: span 2; text-align: right; }
  .deal .pp { font: 800 26px/1 var(--mono); color: var(--go); letter-spacing: -.03em; }
  .deal .pp small { font: 500 11px var(--sans); color: var(--dim); letter-spacing: 0; display: block; margin-top: 4px; }
  .deal .save { display: inline-block; margin-top: 6px; font: 700 11px/1 var(--mono); color: var(--night);
                background: var(--go); border-radius: 999px; padding: 4px 8px; }
  .empty-deals { background: var(--board); border: 1px dashed var(--rule); border-radius: 14px; padding: 18px;
                 color: var(--dim); font-size: 15px; }

  /* ---- All routes ---- */
  .main { padding: 6px 0 60px; }
  .main .sect { color: var(--ink-2); }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -18px; padding: 2px 18px 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 14px var(--sans);
          padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip .n { font: 500 12px var(--mono); opacity: .65; margin-left: 4px; }

  .rows { list-style: none; margin: 6px 0 0; padding: 0; }
  .row { border-bottom: 1px solid var(--line); }
  .row a, .row .nolink { display: grid; grid-template-columns: 52px 1fr auto; gap: 2px 12px; align-items: center;
           padding: 13px 2px; text-decoration: none; }
  .code { font: 800 17px/1 var(--mono); letter-spacing: .02em; grid-row: span 2; }
  .name { font-weight: 600; font-size: 15px; line-height: 1.25; min-width: 0; }
  .name .tag { font: 600 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2);
               border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; margin-left: 6px; vertical-align: 2px; white-space: nowrap; }
  .when { color: var(--ink-2); font-size: 13px; line-height: 1.35; }
  .right { grid-row: span 2; text-align: right; display: flex; align-items: center; gap: 12px; }
  .spark { width: 64px; height: 26px; }
  .spark path { fill: none; stroke: var(--ink-2); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .spark circle { fill: var(--ink); }
  .amt { display: block; font: 700 17px/1 var(--mono); letter-spacing: -.02em; white-space: nowrap; }
  .amt small { display: block; font: 500 11px var(--sans); color: var(--ink-2); margin-top: 4px; letter-spacing: 0; }
  .amt.deal-amt { color: #15803d; }
  @media (prefers-color-scheme: dark) { .amt.deal-amt { color: var(--go); } .spark circle { fill: var(--amber); } }
  .amt.none { color: var(--ink-2); font-weight: 500; font-size: 14px; }
  .bar { display: block; height: 4px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; width: 74px; margin-left: auto; }
  .bar i { display: block; height: 100%; background: var(--ink-2); border-radius: 2px; }
  .bar i.ok { background: #22c55e; }

  .ask { margin-top: 30px; background: var(--ink); color: var(--paper); border-radius: 16px; padding: 18px 18px 20px; }
  .ask h2 { margin: 0 0 6px; font: 700 18px/1.25 var(--sans); }
  .ask p { margin: 0 0 14px; font-size: 14px; opacity: .8; }
  .ask a.btn { display: inline-block; background: var(--amber); color: #2a1d00; font-weight: 700; text-decoration: none;
               padding: 10px 18px; border-radius: 999px; }
  .ask ul { margin: 14px 0 0; padding: 0; list-style: none; font-size: 14px; }
  .ask li { padding: 6px 0; border-top: 1px solid rgba(255,255,255,.12); display: flex; justify-content: space-between; gap: 10px; }
  .ask li span { opacity: .7; }
  @media (prefers-color-scheme: dark) { .ask { background: var(--board); color: var(--text); border: 1px solid var(--rule); } }

  .foot { margin-top: 24px; color: var(--ink-2); font-size: 12.5px; text-align: center; }
  .loading { padding: 40px 0; color: var(--dim); font: 500 14px var(--mono); }
  @media (max-width: 420px) {
    .tiles span { width: 25px; height: 36px; font-size: 20px; }
    .deal .pp { font-size: 22px; }
    .spark { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .deal { transition: none; } }
</style>
</head>
<body>
<header class="board">
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
        Departures · Tampa
      </div>
      <div class="checked" id="checked"></div>
    </div>
    <h1><span class="flap">T</span><span class="flap">P</span><span class="flap">A</span> Fare Board</h1>
    <p class="sub" id="sub">Loading the latest prices…</p>
    <div id="notice"></div>
    <div class="sect" id="deals-title">Under the limit</div>
    <div class="deals" id="deals"><div class="loading">Fetching fares…</div></div>
  </div>
</header>

<main class="main">
  <div class="wrap">
    <div class="sect">Every route we watch</div>
    <div class="chips" id="chips" role="group" aria-label="Filter routes"></div>
    <ul class="rows" id="rows"></ul>
    <section class="ask" id="ask" hidden></section>
    <p class="foot" id="foot"></p>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Number(n).toLocaleString("en-US");
const fmtDay = iso => { if (!iso) return ""; const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }); };
const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 60) return `${m} min ago`; const h = Math.round(m / 60); if (h < 36) return `${h} hr ago`;
  return `${Math.round(h / 24)} days ago`; };
const dates = r => r.return ? `${fmtDay(r.depart)} → ${fmtDay(r.return)}` : `${fmtDay(r.depart)} · one-way`;

function spark(vals) {
  if (!vals || vals.length < 2) return "";
  const w = 64, h = 26, p = 3, lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const pts = vals.map((v, i) => [p + i * (w - 2 * p) / (vals.length - 1), h - p - (v - lo) / span * (h - 2 * p)]);
  const d = pts.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" ");
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Price trend, ${vals.length} checks">
    <path d="${d}"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6"/></svg>`;
}

let DATA = null, filter = "all";
const FILTERS = [["all", "All"], ["deal", "Deals"], ["weekend", "Weekends"], ["oneway", "One-way"], ["roundtrip", "Round trip"]];

function render() {
  const d = DATA, routes = d.routes || [], pax = d.passengers || 2;
  $("checked").innerHTML = d.last_success ? `Updated<br>${esc(ago(d.last_success))}` : "";
  const deals = routes.filter(r => r.is_deal).sort((a, b) => (a.per_person / a.limit) - (b.per_person / b.limit));
  $("sub").innerHTML = `<b>${routes.length}</b> routes watched · <b>${deals.length}</b> under the limit · prices per person, ${pax} traveling, max ${d.max_stops ?? 2} stops`;

  const notes = [...(d.notes || [])];
  if (d.status && d.status !== "ok" && d.last_success) notes.unshift(`The latest check didn't go through (${ago(d.last_checked)}). Showing prices from ${ago(d.last_success)}.`);
  $("notice").innerHTML = notes.length ? `<div class="notice">${notes.map(n => `<p>${esc(n)}</p>`).join("")}</div>` : "";

  $("deals").innerHTML = deals.length ? deals.map(r => `
    <a class="deal" href="${esc(r.link)}" target="_blank" rel="noopener">
      <div class="tiles" aria-hidden="true">${[...r.code].map(c => `<span>${esc(c)}</span>`).join("")}</div>
      <div class="city">${esc(r.name)}</div>
      <div class="price"><div class="pp">${money(r.per_person)}<small>per person<br>${money(r.total)} total</small></div>
        <span class="save">${money(r.limit - r.per_person)} under</span></div>
      <div class="meta">${r.type === "roundtrip" ? "Round trip · " : ""}${esc(dates(r))}</div>
    </a>`).join("")
    : `<div class="empty-deals">Nothing under the limits right now. The full list below shows how close each route is.</div>`;

  $("chips").innerHTML = FILTERS.map(([k, label]) => {
    const n = k === "all" ? routes.length : k === "deal" ? deals.length : routes.filter(r => r.type === k).length;
    return n || k === "all" ? `<button class="chip" data-f="${k}" aria-pressed="${filter === k}">${label}<span class="n">${n}</span></button>` : "";
  }).join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });

  const shown = routes.filter(r => filter === "all" || (filter === "deal" ? r.is_deal : r.type === filter))
    .sort((a, b) => (b.is_deal - a.is_deal) || ((a.per_person ?? 1e9) / a.limit - (b.per_person ?? 1e9) / b.limit));
  $("rows").innerHTML = shown.map(r => {
    const has = r.per_person != null;
    const ratio = has ? Math.min(r.limit / r.per_person, 1) : 0;
    const inner = `
      <span class="code">${esc(r.code)}</span>
      <span class="name">${esc(r.name)}<span class="tag">${esc(r.type === "weekend" ? "Weekend" : r.type_label)}</span></span>
      <span class="right">${spark(r.history)}
        <span class="amt ${has ? (r.is_deal ? "deal-amt" : "") : "none"}">${has ? money(r.per_person) : "No fares"}
          <small>limit ${money(r.limit)}</small>
          ${has ? `<span class="bar" aria-hidden="true"><i class="${r.is_deal ? "ok" : ""}" style="width:${(ratio * 100).toFixed(0)}%"></i></span>` : ""}</span></span>
      <span class="when">${has ? esc(dates(r)) : esc(r.window)}${r.requested_by ? ` · asked for by ${esc(r.requested_by)}` : ""}</span>`;
    return `<li class="row">${has ? `<a href="${esc(r.link)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="nolink">${inner}</div>`}</li>`;
  }).join("");

  const reqs = d.requests || [];
  if (d.sheet_url || reqs.length) {
    $("ask").hidden = false;
    $("ask").innerHTML = `<h2>Want a route watched?</h2>
      <p>Add a row to the routes sheet with your name under “Requested by”. It shows up on the board once it's switched on.</p>
      ${d.sheet_url ? `<a class="btn" href="${esc(d.sheet_url)}" target="_blank" rel="noopener">Request a route</a>` : ""}
      ${reqs.length ? `<ul>${reqs.map(q => `<li>${esc(q.name)} (${esc(q.code)}) <span>waiting · ${esc(q.requested_by)}</span></li>`).join("")}</ul>` : ""}`;
  }
  $("foot").textContent = "Prices come from Google Flights and change often. Tap a route to open those exact dates, and check stops and layovers before booking.";
}

fetch("data/flights.json?" + Date.now()).then(r => r.json()).then(d => { DATA = d; render(); })
  .catch(() => { $("deals").innerHTML = `<div class="empty-deals">The first check hasn't run yet. Check back soon.</div>`; $("sub").textContent = ""; });
</script>
</body>
</html>
